name: build

on:
  push:
    branches: [ master ]
  pull_request:

# Cancel an in-flight run when new commits are pushed to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # vcpkg builds every dependency from source, which is slow. Cache the bootstrapped
      # vcpkg tree (incl. installed packages) keyed on the package list in the generate script.
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('Scripts/Generate-Solution.py') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Configure (vcpkg + CMake)
        run: py Scripts/Generate-Solution.py

      - name: Build all targets
        run: cmake --build build --config Debug

      - name: Run tests
        run: ctest --test-dir build -C Debug --output-on-failure

  # Compile-and-link gate for the optional embedded Doom path. The job above configures with
  # SS_ENABLE_DOOM=OFF, and every translation unit under Games/Doom is wrapped in #ifdef SS_HAS_DOOM,
  # so the OPL driver, the audio bridge and the DMX effect decoder are compiled by nothing in CI without
  # this. Kept as its own job rather than flipping the one above: OFF is what release.yml ships, so it
  # must stay the gated default, and a fetch failure from a third-party repo then reads as "Doom", not
  # "the engine".
  #
  # This proves the code compiles and that every DG_*/OPL_*/SS_DoomAudio_* symbol resolves. It proves
  # NOTHING about behaviour: no tic runs, no OPL sample is generated, no audio device is opened, and
  # neither documented lifetime rule (the main-thread sound queue, the producer stopped in ~DoomSystem)
  # is a compile-time property. Local smoke-test.py with an IWAD remains the only thing that covers those.
  #
  # Needs network at configure time: doomgeneric and chocolate-doom are cloned into the build tree.
  # Nothing GPL is committed, and nothing is uploaded, so this builds a combined work without
  # distributing one.
  windows-doom:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Same key as the job above: the package set is identical with and without Doom, so this restores
      # the same warm tree and installs nothing extra.
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('Scripts/Generate-Solution.py') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Configure (vcpkg + CMake, Doom ON)
        run: py Scripts/Generate-Solution.py --with-doom --build-dir build-doom

      # Executables, not Snowstorm-Core: Core and DoomGame are static libraries, so building them alone
      # would compile the Doom code without ever resolving its symbols. Both of these link Core and
      # DoomGame WHOLE_ARCHIVE, which forces every TU into the image and the link to be real.
      # Snowstorm-Doom is the game; Snowstorm-Runtime is the generic player that also links it, and the
      # two are separate links worth gating separately.
      - name: Build (game + runtime, links the Doom path)
        run: cmake --build build-doom --config Debug --target Snowstorm-Doom Snowstorm-Runtime
